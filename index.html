<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAREEM OMAR | Official Portfolio</title>
    
    <link rel="icon" type="image/jpeg" href="13.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* الخطوط */
        @font-face { font-family: 'Dahka'; src: url('ضحكه.ttf'); }
        @font-face { font-family: 'Rawnaq'; src: url('دي جي راونق.ttf'); }
        @font-face { font-family: 'Kufa'; src: url('الكوفا.ttf'); }
        @font-face { font-family: 'Amira'; src: url('اميرة.ttf'); }
        @font-face { font-family: 'Galaxy'; src: url('جالاكسي.ttf'); }
        @font-face { font-family: 'Belabelo'; src: url('بلابيلو.ttf'); }

        :root { 
            --p: #00f2ff; --s: #bc00ff; 
            --bg: #050508; --text: #ffffff;
            --card: rgba(255, 255, 255, 0.03);
            --active-font: 'Arial', sans-serif;
        }

        body.light-mode {
            --bg: #f4f4f9; --text: #1a1a1a;
            --card: rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--text); font-family: var(--active-font); transition: 0.4s; overflow-x: hidden; }

        /* Navigation */
        nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); padding: 12px 25px; border-radius: 100px; border: 1px solid var(--p); display: flex; gap: 20px; z-index: 2000; }
        nav a { color: #fff; text-decoration: none; font-size: 1.3rem; transition: 0.3s; }
        nav a:hover { color: var(--p); transform: scale(1.2); }

        /* Controls */
        .controls { position: fixed; top: 20px; right: 20px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; }
        .ctrl-btn { width: 45px; height: 45px; border-radius: 12px; background: linear-gradient(45deg, var(--p), var(--s)); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        .font-menu { position: fixed; top: 75px; right: 20px; background: var(--bg); border: 1px solid var(--p); padding: 10px; border-radius: 15px; display: none; flex-direction: column; gap: 5px; z-index: 2999; }
        .font-btn { background: var(--card); border: none; color: var(--text); padding: 8px; border-radius: 8px; cursor: pointer; text-align: right; }

        /* Sections */
        section { padding: 80px 20px; max-width: 1100px; margin: 0 auto; }
        .section-title { font-size: 2.2rem; color: var(--p); margin-bottom: 40px; text-align: center; border-bottom: 2px solid var(--s); display: inline-block; padding-bottom: 10px; }

        /* Header */
        header { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .main-logo { width: 140px; height: 140px; border-radius: 50%; border: 3px solid var(--p); margin-bottom: 20px; object-fit: cover; box-shadow: 0 0 25px var(--p); }
        .p-photo { width: 65px; height: 65px; border-radius: 12px; border: 2px solid var(--s); margin: 0 5px; object-fit: cover; }

        /* Gallery - الحل النهائي للانيميشن اللانهائي */
        .gallery-container { 
            overflow: hidden; 
            padding: 40px 0; 
            width: 100%; 
            background: rgba(0,0,0,0.2);
            position: relative;
        }

        .gallery-track { 
            display: flex; 
            gap: 20px; 
            width: max-content; /* مهم جداً لترك الصور بجانب بعضها */
            animation: infiniteScroll 40s linear infinite; 
            will-change: transform;
        }

        .gallery-img { 
            width: 280px; 
            height: 380px; 
            border-radius: 20px; 
            object-fit: cover; 
            border: 2px solid var(--p); 
            flex-shrink: 0;
            transition: 0.5s ease;
        }

        .gallery-img:hover {
            transform: scale(1.05) translateY(-10px);
            border-color: var(--s);
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.3);
        }

        /* الانيميشن يتحرك لنصف العرض فقط لأننا سنكرر الصور مرتين */
        @keyframes infiniteScroll { 
            0% { transform: translateX(0); } 
            100% { transform: translateX(-50%); } 
        }

        .gallery-track:hover { animation-play-state: paused; }

        /* باقي الستايل */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-align: center; transition: 0.3s; }
        .p-item { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-decoration: none; color: var(--text); transition: 0.3s; display: block; text-align: center; }
    </style>
</head>
<body>

<div class="controls">
    <button class="ctrl-btn" id="themeBtn"><i class="fas fa-adjust"></i></button>
    <button class="ctrl-btn" onclick="toggleMenu()"><i class="fas fa-font"></i></button>
</div>

<div class="font-menu" id="fontMenu">
    <button class="font-btn" style="font-family:'Dahka'" onclick="setF('Dahka')">ضحكة</button>
    <button class="font-btn" style="font-family:'Rawnaq'" onclick="setF('Rawnaq')">راونق</button>
    <button class="font-btn" style="font-family:'Kufa'" onclick="setF('Kufa')">الكوفا</button>
    <button class="font-btn" style="font-family:'Amira'" onclick="setF('Amira')">أميرة</button>
    <button class="font-btn" style="font-family:'Galaxy'" onclick="setF('Galaxy')">جالاكسي</button>
    <button class="font-btn" style="font-family:'Belabelo'" onclick="setF('Belabelo')">بلابيلو</button>
</div>

<nav>
    <a href="#home"><i class="fas fa-home"></i></a>
    <a href="#about"><i class="fas fa-fingerprint"></i></a>
    <a href="#services"><i class="fas fa-rocket"></i></a>
    <a href="#works"><i class="fas fa-code-branch"></i></a>
    <a href="#contact"><i class="fas fa-paper-plane"></i></a>
</nav>

<header id="home">
    <img src="13.jpg" class="main-logo" alt="Logo">
    <h1 style="font-size: 3.5rem; font-family: 'Orbitron';">KAREEM OMAR</h1>
    <p style="color: var(--p); letter-spacing: 5px;">THE VISUAL ARCHITECT</p>
</header>

<section id="gallery">
    <h2 class="section-title">المعرض الرقمي</h2>
    <div class="gallery-container">
        <div class="gallery-track" id="track">
            </div>
    </div>
</section>

<script>
    // تغيير الثيم
    const btn = document.getElementById('themeBtn');
    btn.onclick = () => document.body.classList.toggle('light-mode');

    // القائمة والخطوط
    function toggleMenu() {
        const m = document.getElementById('fontMenu');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }
    function setF(f) {
        document.body.style.setProperty('--active-font', f);
        toggleMenu();
    }

    // منطق التكرار اللانهائي الصحيح
    window.onload = function() {
        const t = document.getElementById('track');
        if(t) {
            const imagesCount = 21; 
            let content = '';

            // ننشئ HTML لـ 21 صورة
            for(let j=1; j<=imagesCount; j++) {
                content += `<img src="${j}.jpg" class="gallery-img" onerror="this.style.display='none'">`;
            }

            // السر هنا: نضع الصور مرتين داخل التراك (Track)
            // المجموعة الثانية تبدأ فور انتهاء الأولى، ولأن الانيميشن يتحرك لـ 50%- فقط،
            // فإنه سيعود للبداية بشكل غير ملحوظ تماماً.
            t.innerHTML = content + content;
        }
    };
</script>
</body>
</html>
